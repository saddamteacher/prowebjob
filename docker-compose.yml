version: "3.9"

services:
  web:
    build: .
    container_name: jobhunter-crm
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      DJANGO_SECRET_KEY:    ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG:         "False"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost}
      GROQ_API_KEY:         ${GROQ_API_KEY}
      GROQ_MODEL:           ${GROQ_MODEL:-llama-3.1-8b-instant}
      AI_COMPANY_CHECK_ENABLED: "True"
      AI_DUPLICATE_CHECK_ENABLED: "True"
      PARSER_INTERVAL:      "30"
      DAILY_TOTAL_LIMIT:    "200"
      LOG_LEVEL:            "INFO"
      TZ:                   "Asia/Tashkent"
    volumes:
      - db_data:/app/jobhunter_crm/db.sqlite3
      - static_data:/app/jobhunter_crm/staticfiles
      - media_data:/app/jobhunter_crm/media
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  db_data:
  static_data:
  media_data:
